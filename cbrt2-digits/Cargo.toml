[package]
name = "cbrt2-digits"
version = "0.1.0"
edition = "2024"
publish = false
license = "LGPL-3.0-or-later"
description = "Print a chosen number of digits of the cube root of 2"
readme = "README.md"

[[bin]]
name = "cbrt2"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
